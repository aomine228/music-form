<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Вправа на HTML та CSS</title>
</head>
<body>
    <div class="gif-container">
        <img src="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExaWl1aTFudWtjYW9mcmlqNzY4MG1xNTg5cnFidWRrbXpnNWJ0YzdpYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4oMoIbIQrvCjm/giphy.gif" alt="Барт Сімпсон танцює під музику">
    </div>

    <div class="form-container">
        <form action="#">

            <div class="form-group">
                <label for="music-preference">Який Ваш улюблений жанр музики?</label>
                <select name="music-preference" id="music-preference">
                    <option value="nothing"></option>
                    <option value="pop">Поп</option>
                    <option value="rock">Рок</option>
                    <option value="hiphop">Хіп-хоп</option>
                    <option value="classical">Класика</option>
                </select>
            </div>

            <div class="form-group">
                <label for="text-input">Ваші думки про музику:</label>
                <textarea name="text-input" id="text-input" role="4" placeholder="Напишіть тут щось..."></textarea>
            </div>

            <div class="form-group">
                <label for="file-upload">Завантажте зображення:</label>
                <input type="file" id="file-upload" name="file-upload" accept="image/*">
            </div>

            <div class="form-group">
                <button type="submit">Відправити</button>
            </div>

        </form>
    </div>

</body>
</html>
